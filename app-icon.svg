<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="160" stroke="#334155" stroke-width="28" fill="none"/>
  <circle cx="256" cy="256" r="160" stroke="url(#ring1)" stroke-width="28" stroke-linecap="round" stroke-dasharray="1005" stroke-dashoffset="350" fill="none" transform="rotate(-90 256 256)"/>
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="100" stroke="#334155" stroke-width="22" fill="none"/>
  <circle cx="256" cy="256" r="100" stroke="url(#ring2)" stroke-width="22" stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="200" fill="none" transform="rotate(-90 256 256)"/>
  <!-- Center Dot / Pulse -->
  <circle cx="256" cy="256" r="28" fill="#60a5fa"/>
</svg>
